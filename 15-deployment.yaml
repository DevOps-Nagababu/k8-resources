apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    project: roboshop
    component: frontend
    environment: dev
  annotations:
    kubernetes.io/change-cause: "Moving version to nginx:1.30.1"
spec:
  # modify replicas according to your case
  replicas: 3
  selector:
    matchLabels:
      project: roboshop
      component: frontend
      environment: dev
      # pod definetion
  template:
    metadata:
      labels:
        project: roboshop
        component: frontend
        environment: dev
    spec:
      containers:
      - name: nginx
        image: nginx:1.30.1
